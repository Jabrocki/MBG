openapi: 3.1.0
info:
  title: HUBMI API — Małopolska Social Innovation Hub
  description: 'Backend aplikacyjny: matchmaking potrzeb społecznych, innowacje, przepływy
    pracy, głosowanie i piloty.'
  version: 0.1.0
paths:
  /api/v1/auth/demo:
    post:
      tags:
      - Uwierzytelnianie
      summary: Wybór syntetycznego konta demo (user/admin)
      operationId: login_demo_api_v1_auth_demo_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DemoLoginRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemoTokenResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/me:
    get:
      tags:
      - Uwierzytelnianie
      summary: Dane aktualnie zalogowanego użytkownika
      operationId: get_me_api_v1_auth_me_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
      security:
      - HTTPBearer: []
  /api/v1/reports:
    post:
      tags:
      - Zgłoszenia problemów
      summary: Zgłoszenie problemu społecznego
      operationId: submit_report_api_v1_reports_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportCreateRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportSubmissionResult'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/v1/reports/{report_id}/categories:
    patch:
      tags:
      - Zgłoszenia problemów
      summary: Korekta kategorii przez użytkownika
      operationId: update_categories_api_v1_reports__report_id__categories_patch
      security:
      - HTTPBearer: []
      parameters:
      - name: report_id
        in: path
        required: true
        schema:
          type: integer
          title: Report Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryCorrectionRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/reports/{report_id}/confirm-grouping:
    post:
      tags:
      - Zgłoszenia problemów
      summary: Potwierdzenie przypisania do problemu lub utworzenie nowego
      operationId: confirm_grouping_api_v1_reports__report_id__confirm_grouping_post
      security:
      - HTTPBearer: []
      parameters:
      - name: report_id
        in: path
        required: true
        schema:
          type: integer
          title: Report Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmGroupingRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CanonicalProblemResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/problems/nearby:
    get:
      tags:
      - Problemy kanoniczne i Matchmaking
      summary: Odkrywanie problemów w wybranym promieniu geograficznym
      operationId: get_nearby_problems_api_v1_problems_nearby_get
      security:
      - HTTPBearer: []
      parameters:
      - name: lat
        in: query
        required: true
        schema:
          type: number
          description: Szerokość geograficzna użytkownika
          title: Lat
        description: Szerokość geograficzna użytkownika
      - name: lon
        in: query
        required: true
        schema:
          type: number
          description: Długość geograficzna użytkownika
          title: Lon
        description: Długość geograficzna użytkownika
      - name: radius_km
        in: query
        required: false
        schema:
          type: number
          description: Promień odkrywania w kilometrach
          default: 15.0
          title: Radius Km
        description: Promień odkrywania w kilometrach
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CanonicalProblemResponse'
                title: Response Get Nearby Problems Api V1 Problems Nearby Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/problems/{problem_id}/matches:
    get:
      tags:
      - Problemy kanoniczne i Matchmaking
      summary: Dopasowane innowacje społeczne (do 10 wyników)
      operationId: get_problem_matches_api_v1_problems__problem_id__matches_get
      security:
      - HTTPBearer: []
      parameters:
      - name: problem_id
        in: path
        required: true
        schema:
          type: integer
          title: Problem Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchListResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/problems/{problem_id}/coordinates:
    get:
      tags:
      - Problemy kanoniczne i Matchmaking
      summary: Współrzędne 3D dla wizualizacji semantycznej
      operationId: get_problem_coordinates_api_v1_problems__problem_id__coordinates_get
      security:
      - HTTPBearer: []
      parameters:
      - name: problem_id
        in: path
        required: true
        schema:
          type: integer
          title: Problem Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoordinatesResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/catalogue:
    get:
      tags:
      - Katalog innowacji
      summary: Przeglądanie i wyszukiwanie w katalogu innowacji
      operationId: search_catalogue_api_v1_catalogue_get
      security:
      - HTTPBearer: []
      parameters:
      - name: q
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Fraza wyszukiwania
          title: Q
        description: Fraza wyszukiwania
      - name: category
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Kategoria tematyczna
          title: Category
        description: Kategoria tematyczna
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/ideas:
    post:
      tags:
      - Kreator pomysłów
      summary: Utworzenie wersji roboczej pomysłu
      operationId: create_idea_draft_api_v1_ideas_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdeaCreateRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdeaResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/v1/ideas/{idea_id}/submit:
    post:
      tags:
      - Kreator pomysłów
      summary: Przekazanie pomysłu do kolejki przetwarzania AI
      operationId: submit_idea_to_ai_api_v1_ideas__idea_id__submit_post
      security:
      - HTTPBearer: []
      parameters:
      - name: idea_id
        in: path
        required: true
        schema:
          type: integer
          title: Idea Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIJobStatusResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/ideas/{idea_id}/author-confirm:
    post:
      tags:
      - Kreator pomysłów
      summary: Potwierdzenie ustrukturyzowanego pomysłu przez autora
      operationId: author_confirm_idea_api_v1_ideas__idea_id__author_confirm_post
      security:
      - HTTPBearer: []
      parameters:
      - name: idea_id
        in: path
        required: true
        schema:
          type: integer
          title: Idea Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdeaAuthorConfirmRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdeaResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/ideas/{idea_id}/admin-approve:
    post:
      tags:
      - Kreator pomysłów
      summary: Zatwierdzenie publikacji pomysłu przez administratora
      operationId: admin_approve_idea_api_v1_ideas__idea_id__admin_approve_post
      security:
      - HTTPBearer: []
      parameters:
      - name: idea_id
        in: path
        required: true
        schema:
          type: integer
          title: Idea Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdeaResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/ideas/public:
    get:
      tags:
      - Kreator pomysłów
      summary: Lista opublikowanych pomysłów poddanych dyskusji
      operationId: get_public_ideas_api_v1_ideas_public_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/IdeaResponse'
                type: array
                title: Response Get Public Ideas Api V1 Ideas Public Get
      security:
      - HTTPBearer: []
  /api/v1/votes/cards:
    get:
      tags:
      - Głosowanie społecznościowe (Swipe cards)
      summary: Karty rozwiązań do głosowania dla danego problemu
      operationId: get_cards_for_problem_api_v1_votes_cards_get
      security:
      - HTTPBearer: []
      parameters:
      - name: problem_id
        in: query
        required: true
        schema:
          type: integer
          description: ID problemu lokalnego
          title: Problem Id
        description: ID problemu lokalnego
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SwipeCardResponse'
                title: Response Get Cards For Problem Api V1 Votes Cards Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/votes:
    post:
      tags:
      - Głosowanie społecznościowe (Swipe cards)
      summary: Oddanie lub zmiana głosu (Popieram / Pomijam)
      operationId: cast_vote_api_v1_votes_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VoteCreateRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoteResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/v1/votes/{vote_id}:
    delete:
      tags:
      - Głosowanie społecznościowe (Swipe cards)
      summary: Cofnięcie oddanego głosu
      operationId: undo_vote_api_v1_votes__vote_id__delete
      security:
      - HTTPBearer: []
      parameters:
      - name: vote_id
        in: path
        required: true
        schema:
          type: integer
          title: Vote Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/pilots:
    post:
      tags:
      - Pilotaże i Wolontariat
      summary: Utworzenie inicjatywy pilotażowej (tylko administrator)
      operationId: create_pilot_api_v1_pilots_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PilotCreateRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PilotResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/v1/pilots/{pilot_id}/transition:
    post:
      tags:
      - Pilotaże i Wolontariat
      summary: Zmiana statusu cyklu życia pilota (tylko administrator)
      operationId: transition_pilot_status_api_v1_pilots__pilot_id__transition_post
      security:
      - HTTPBearer: []
      parameters:
      - name: pilot_id
        in: path
        required: true
        schema:
          type: integer
          title: Pilot Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PilotTransitionRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PilotResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/pilots/{pilot_id}/volunteer:
    post:
      tags:
      - Pilotaże i Wolontariat
      summary: Zgłoszenie się jako wolontariusz do projektu
      operationId: register_volunteer_api_v1_pilots__pilot_id__volunteer_post
      security:
      - HTTPBearer: []
      parameters:
      - name: pilot_id
        in: path
        required: true
        schema:
          type: integer
          title: Pilot Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VolunteerResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - Pilotaże i Wolontariat
      summary: Rezygnacja z wolontariatu
      operationId: cancel_volunteer_api_v1_pilots__pilot_id__volunteer_delete
      security:
      - HTTPBearer: []
      parameters:
      - name: pilot_id
        in: path
        required: true
        schema:
          type: integer
          title: Pilot Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/pilots/{pilot_id}/accept-offer:
    post:
      tags:
      - Pilotaże i Wolontariat
      summary: Akceptacja zaoferowanego miejsca z listy oczekujących
      operationId: accept_place_offer_api_v1_pilots__pilot_id__accept_offer_post
      security:
      - HTTPBearer: []
      parameters:
      - name: pilot_id
        in: path
        required: true
        schema:
          type: integer
          title: Pilot Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VolunteerResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/pilots/{pilot_id}/feedback:
    post:
      tags:
      - Pilotaże i Wolontariat
      summary: Ocena satysfakcji beneficjenta lub wolontariusza
      operationId: submit_feedback_api_v1_pilots__pilot_id__feedback_post
      security:
      - HTTPBearer: []
      parameters:
      - name: pilot_id
        in: path
        required: true
        schema:
          type: integer
          title: Pilot Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SatisfactionFeedbackRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SatisfactionFeedbackResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/admin/problems/merge:
    post:
      tags:
      - Panel Administratora
      summary: Scalenie problemów kanonicznych z przeliczeniem unikalnych zgłaszających
        i głosów
      operationId: merge_problems_api_v1_admin_problems_merge_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MergeProblemsRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CanonicalProblemResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/v1/admin/problems/split:
    post:
      tags:
      - Panel Administratora
      summary: Wydzielenie części zgłoszeń do nowego problemu kanonicznego
      operationId: split_problem_api_v1_admin_problems_split_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SplitProblemRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CanonicalProblemResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/v1/admin/solutions/merge:
    post:
      tags:
      - Panel Administratora
      summary: Scalenie zduplikowanych rozwiązań
      operationId: merge_solutions_api_v1_admin_solutions_merge_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MergeSolutionsRequest'
        required: true
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/v1/admin/pilots/{pilot_id}/promote-volunteer:
    post:
      tags:
      - Panel Administratora
      summary: Ręczna promocja wolontariusza z listy oczekujących
      operationId: promote_volunteer_api_v1_admin_pilots__pilot_id__promote_volunteer_post
      security:
      - HTTPBearer: []
      parameters:
      - name: pilot_id
        in: path
        required: true
        schema:
          type: integer
          title: Pilot Id
      - name: user_id
        in: query
        required: true
        schema:
          type: integer
          title: User Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VolunteerResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/admin/retention/purge:
    post:
      tags:
      - Panel Administratora
      summary: Uruchomienie procedury wygaszania surowych raportów po 30 dniach
      operationId: purge_retention_api_v1_admin_retention_purge_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      security:
      - HTTPBearer: []
  /api/v1/ideas/{idea_id}/thread:
    get:
      tags:
      - Dyskusje, Powiadomienia i Adaptacje instytucjonalne
      summary: Wątek dyskusyjny przypisany do pomysłu
      operationId: get_idea_thread_api_v1_ideas__idea_id__thread_get
      security:
      - HTTPBearer: []
      parameters:
      - name: idea_id
        in: path
        required: true
        schema:
          type: integer
          title: Idea Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscussionThreadResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/threads/{thread_id}/messages:
    post:
      tags:
      - Dyskusje, Powiadomienia i Adaptacje instytucjonalne
      summary: Wysłanie wiadomości w wątku dyskusyjnym
      operationId: post_thread_message_api_v1_threads__thread_id__messages_post
      security:
      - HTTPBearer: []
      parameters:
      - name: thread_id
        in: path
        required: true
        schema:
          type: integer
          title: Thread Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ThreadMessageCreateRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThreadMessageResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/notifications:
    get:
      tags:
      - Dyskusje, Powiadomienia i Adaptacje instytucjonalne
      summary: In-app powiadomienia dla bieżącego użytkownika
      operationId: get_notifications_api_v1_notifications_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/NotificationResponse'
                type: array
                title: Response Get Notifications Api V1 Notifications Get
      security:
      - HTTPBearer: []
  /api/v1/notifications/{notif_id}/read:
    post:
      tags:
      - Dyskusje, Powiadomienia i Adaptacje instytucjonalne
      summary: Oznaczenie powiadomienia jako przeczytane
      operationId: mark_notification_read_api_v1_notifications__notif_id__read_post
      security:
      - HTTPBearer: []
      parameters:
      - name: notif_id
        in: path
        required: true
        schema:
          type: integer
          title: Notif Id
