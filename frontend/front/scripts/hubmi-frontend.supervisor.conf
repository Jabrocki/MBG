[program:hubmi-frontend]
directory=/root/hubmi/frontend/front
command=/opt/nvm/versions/node/v24.20.0/bin/node node_modules/vite/bin/vite.js preview --host 0.0.0.0 --port 10100
environment=PROC_NAME="%(program_name)s",PATH="/opt/nvm/versions/node/v24.20.0/bin:/usr/local/bin:/usr/bin:/bin"
autostart=true
autorestart=unexpected
startsecs=1
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
